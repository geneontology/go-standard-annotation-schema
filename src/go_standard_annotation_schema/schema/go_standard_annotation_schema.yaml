id: https://w3id.org/geneontology/go-standard-annotation-schema
name: go-standard-annotation-schema
title: GO Standard Annotation Schema
description: >-
  LinkML schema for GO Standard Annotations
license: BSD-3-Clause
see_also:
  - https://geneontology.github.io/go-standard-annotation-schema
  - https://github.com/geneontology/go-annotation/blob/master/specs/gpad-gpi-2-0.md
  - https://geneontology.github.io/docs/gene-product-association-data-gpad-format
  - https://geneontology.org/docs/gene-product-information-gpi-format-2.0

prefixes:
  go_standard_annotation_schema: https://w3id.org/geneontology/go-standard-annotation-schema/
  linkml: https://w3id.org/linkml/
  PR: http://purl.obolibrary.org/obo/PR_
  SO: http://purl.obolibrary.org/obo/SO_
  GO: http://purl.obolibrary.org/obo/GO_

default_prefix: go_standard_annotation_schema
default_range: string

imports:
  - linkml:types

notes:
  - This schema uses custom types with structured patterns to represent various types of
    identifiers. However, LinkML tooling currently does not materialize structured
    patterns in generated artifacts. The necessary changes are currently (as of
    2026-08-13) pending in https://github.com/linkml/linkml/pull/3832. Once this PR is
    merged, the changes released, and the LinkML dependency in this project updated, we
    will have stronger validation of identifier formats.
  - This schema deviates from the grammar and specs when necessary to either reflect
    actual data or to establish better modeling practices. These deviations are
    documented as notes on specific schema elements.

types:
  external_identifier:
    description: >-
      An identifier of an object from an external source, such as a gene product, an
      ontology term, or a publication.
    typeof: string
    structured_pattern:
      syntax: "{prefix}:{local_id}"
      interpolated: true
      partial_match: false

  eco_identifier:
    description: >-
      An identifier of an ECO term.
    typeof: external_identifier
    structured_pattern:
      syntax: "ECO:{local_id}"
      interpolated: true
      partial_match: false

  go_identifier:
    description: >-
      An identifier of a GO term.
    typeof: external_identifier
    structured_pattern:
      syntax: "GO:{local_id}"
      interpolated: true
      partial_match: false

  ro_identifier:
    description: >-
      An identifier of a Relation Ontology term.
    typeof: external_identifier
    structured_pattern:
      syntax: "(RO|BFO):{local_id}"
      interpolated: true
      partial_match: false

  ncbi_taxon_identifier:
    description: >-
      An identifier of a taxon from the NCBI Taxonomy database.
    typeof: external_identifier
    structured_pattern:
      syntax: "NCBITaxon:{local_id}"
      interpolated: true
      partial_match: false

  contributor_identifier:
    description: >-
      An identifier of a contributor, such as a curator or user who entered or changed
      an annotation.
    typeof: external_identifier
    structured_pattern:
      syntax: "(orcid|goc):{local_id}"
      interpolated: true
      partial_match: false

slots:
  db_object_id:
    description: >-
      A unique identifier for the item being annotated.
    range: external_identifier
    required: true

  negation:
    description: >-
      A boolean indicating whether the annotation is negated.
    range: boolean
    required: false
    notes:
      - Decide if this should be required in the schema so that it is always explicitly
        set to true or false. Or, is it okay to have it be optional and assumed false if
        not present?

  relation:
    description: >-
      Relation from the Relation Ontology that describe how the annotated biological
      entity relates to the GO term with which it is associated.
    range: external_identifier
    required: true
    notes:
      - The GPAD spec says that the "relation used SHOULD come from the allowed
        gene-product-to-term relations". Decide whether to enforce this in the schema
        via an enum.

  ontology_class_id:
    description: >-
      The GO identifier for the term attributed to the DB object ID.
    range: go_identifier
    required: true

  references:
    description: >-
      One or more unique identifiers for a single source cited as an authority for the
      attribution of the GO ID to the DB object ID. This may be a literature reference
      or a database record. Valid references are one of: PubMed, DOI, GO_REF, MOD
      reference.
    range: external_identifier
    required: true
    multivalued: true
    minimum_cardinality: 1

  evidence_type:
    description: >-
      The Evidence & Conclusion Ontology (ECO) identifier for the evidence code that
      supports the association between the DB object ID and the GO term.
    range: eco_identifier
    required: true

  with_or_from:
    description: >-
      Used with specific ECO codes to capture an additional identifier supporting the
      evidence for the annotation. For example, it can identify another gene product to
      which the annotated gene product is similar (ISS) or interacts with (IPI).
      Population of the With/From is mandatory for certain evidence codes.
    range: external_identifier
    required: false
    multivalued: true
    comments:
      - Cardinality must be 0 for evidence codes IDA, TAS, NAS, or ND
      - Cardinality must be 1, >1 for IEA, IC, IGI, IPI, ISS & child terms of ISS

  interacting_taxon_id:
    description: >-
      Taxonomic identifier for interacting organism to be used only in conjunction with
      terms that have the biological process term 'GO:0044419 biological process
      involved in interspecies interaction between organisms' or the cellular component
      term 'GO:0018995 host cellular component' as an ancestor. Identifiers must come
      from NCBI Taxonomy database.
    range: ncbi_taxon_identifier
    required: false
    multivalued: true

  annotation_date:
    description: >-
      Date on which the annotation was made
    range: date
    required: true
    notes:
      - The GPAD file description says that this is a date in the format `YYYY-MM-DD`.
        The spec says that it is a date or datetime. Decide whether to permit date,
        datetime, or both.

  assigned_by:
    description: >-
      The database which made the annotation one of the values from the set of GOC
      groups; used for tracking the source of an individual annotation.
    range: string
    required: true
    comments:
      - Value may differ from the DB:DB Object ID column. Any annotation that is made by
        one database and incorporated into another retains the original value.

  extension_relation:
    description: >-
      A term from the Relation Ontology that describes how the GO term in the extension
      relates to the GO term in the annotation.
    range: ro_identifier
    required: true

  extension_term:
    description: >-
      The gene product, chemical, cell type, anatomical structure, or other entity that
      is used to further specify the GO term in the annotation.
    range: external_identifier
    required: true

  annotation_extensions:
    description: >-
      Annotation extensions allow GO terms in annotations to be further specified, using
      gene products, chemicals, cell types, anatomical structures, to provide additional
      biological context. The cross-reference is prefaced by an appropriate relationship
      from the Relation Ontology.
    range: AnnotationExtension
    required: false
    multivalued: true
    inlined: true
    inlined_as_list: true
    notes:
      - Annotation extensions do not have a unique identifier, so the schema indicates
        they are inlined as a list. This makes change operations that target a specific
        annotation extension more difficult.

  annotation_properties:
    description: Additional properties associated with an annotation.
    range: AnnotationProperties
    required: false
    inlined: true

  db_object_symbol:
    description: >-
      The symbol of the entity being annotated.
    range: string
    required: false
    pattern: "^\\S+$"
    notes:
      - The GPI grammar and narrative spec both say that this is required, but in
        practice it is missing in many rows of existing GPI files. Decide whether this
        should be required in the schema and handled in the file parsing code if it is
        missing.

  db_object_name:
    description: >-
      The name of the entity being annotated.
    range: string
    required: false
    notes:
      - The GPI grammar implies that column 3 is required, but the narrative spec says
        that it is optional. The narrative spec seems more appropriate, so that is what
        is implemented here. Decide if that is correct.

  db_object_synonyms:
    description: >-
      Alternative names for the entity being annotated.
    range: string
    required: false
    multivalued: true

  db_object_type:
    description: >-
      The class of biological entity being annotated.
    range: external_identifier
    required: true
    comments:
      - This field should describe the type of biological object as defined by the
        contributing database. For example, WormBase identifiers represent genes,
        PomBase identifiers represent protein-coding genes, and SGD identifiers
        represent proteins.
      - The entity type value must be provided as an ontology term identifier from
        Sequence Ontology, Protein Ontology, or GO, and must correspond to one of the
        permitted GPI entity types or a more granular child term. Common entries include
        PR:000000001 (protein), GO:0032991 (protein-containing complex), SO:0001217
        (protein-coding gene), SO:0000655 (ncRNA) or any SO child term, SO:0001263
        (ncRNA-coding gene) or any SO child term, SO:0000336 (pseudogene).
      - GO does not allow 'gene' and 'gene product' as biological entity types, as this
        does not allow to differentiate between proteins and ncRNAs products.
    notes:
      - The GPI grammar says that column 5 has cardinality 1..*, `ID ( '|' ID )*` but
        the narrative spec says that it cardinality 1. The narrative spec seems more
        appropriate, so that is what is implemented here. Decide if that is correct.

  db_object_taxon_id:
    description: >-
      The NCBI Taxonomy identifier for the organism (species or strain) encoding the
      entity being annotated.
    range: ncbi_taxon_identifier
    required: true

  encoded_by:
    description: >-
      For proteins and transcripts, the gene that encodes the entity being annotated.
    range: external_identifier
    required: false
    multivalued: true

  canonical_object_id:
    description: >-
      If the entity being annotated is a gene, gene-centric reference protein or a
      protein complex, this should repeat the ID of the object being annotated. If the
      entity being annotated is derived from a gene product such as a protein isoform, a
      modified protein or a processed transcript (e. g. miRNA), then this refers to the
      gene-centric ID of the annotated entity.
    range: external_identifier
    required: true
    notes:
      - The GPI grammar says that column 8 has cardinality 0..*, `( ID ( '|' ID )* )?`
        but the narrative spec says that it cardinality 1. The narrative spec seems more
        appropriate, so that is what is implemented here. Decide if that is correct.

  protein_containing_complex_members:
    description: >-
      If the entity being annotated is a protein-containing complex, this should list
      the gene-centric canonical protein identifiers.
    range: external_identifier
    required: false
    multivalued: true

  db_xrefs:
    description: >-
      Cross-references to other databases for the entity being annotated.
    range: external_identifier
    required: false
    multivalued: true
    comments:
      - This field is mandatory if the prefix of the annotated entity's identifier is
        not UniProtKB, RNACentral, or ComplexPortal. In these cases, db_xrefs must
        include the corresponding UniProtKB ID, RNACentral, or ComplexPortal as
        appropriate according to the Object Type.
      - Additional cross references such as NCBI gene or protein IDs, HGNC, etc, may
        also be included.

  gene_product_properties:
    description: The properties associated with an entity in a GPI row.
    range: GeneProductProperties
    required: false
    inlined: true

classes:
  Annotation:
    description: >-
      An association between a gene product and a GO term, with an evidence code, a
      reference to support the association, and other data associated with the gene
      product or the annotation.
    slots:
      - db_object_id
      - negation
      - relation
      - ontology_class_id
      - references
      - evidence_type
      - with_or_from
      - interacting_taxon_id
      - annotation_date
      - assigned_by
      - annotation_extensions
      - annotation_properties

  AnnotationExtension:
    description: >-
      Annotation extensions allow GO terms in annotations to be further specified, using
      gene products, chemicals, cell types, anatomical structures, to
      provide additional biological context.
    slots:
      - extension_relation
      - extension_term

  AnnotationProperties:
    description: >-
      The closed set of properties associated with an annotation.
    attributes:
      id:
        description: The contributing database's unique identifier for an annotation.
        range: external_identifier
        required: false

      model_state:
        description: The GO-CAM model state.
        range: string
        required: false
        pattern: "^[A-Za-z_]+$"
        notes:
          - The GPAD grammar says that this should be a string of only alphabetic
            characters, but this doesn't account for the already used "internal_test"
            model state. The pattern has been updated to allow underscores as well.

      noctua_model_id:
        description: The unique identifier of the associated GO-CAM model.
        range: external_identifier
        required: false

      contributor_id:
        description: >-
          The identifier of a curator or user who entered or changed an annotation.
        range: contributor_identifier
        required: false
        multivalued: true

      reviewer_id:
        description: >-
          The identifier of a curator or user who last reviewed an annotation.
        range: contributor_identifier
        required: false
        multivalued: true

      creation_date:
        description: The date on which the annotation was created.
        required: false
        range: date
        notes:
          - The grammar says this should be a date or datetime, but the narrative spec
            is less clear. This is being modeled as a date to keep it in alignment with
            other date fields for now.

      modification_date:
        description: A date on which the annotation was modified.
        required: false
        multivalued: true
        range: date
        notes:
          - The grammar says this should be a date or datetime, but the narrative spec
            is less clear. This is being modeled as a date to keep it in alignment with
            other date fields for now.

      reviewed_date:
        description: A date on which the annotation was reviewed.
        required: false
        multivalued: true
        range: date
        notes:
          - The grammar says this should be a date or datetime, but the narrative spec
            is less clear. This is being modeled as a date to keep it in alignment with
            other date fields for now.

      comment:
        description: Free text about a specific annotation.
        range: string
        required: false
        multivalued: true
    notes:
      - Attributes are used instead of slots here because the names of the attributes
        are somewhat tightly coupled to the GPAD file format. They should not be reused
        or modified in other contexts, as top-level slots might be.

  GeneProductProperties:
    description: The closed set of properties associated with an entity in a GPI row.
    attributes:
      db_subset:
        description: The status of a UniProtKB accession with respect to curator review.
        range: string
        required: false
        equals_string_in:
          - TrEMBL
          - Swiss-Prot
        notes:
          - Using equals_string_in instead of an enum here to avoid issues with the
            specific capitalization and punctuation of the values.

      uniprot_proteome:
        description: >-
          The UniProt proteome accession for the set of proteins that constitute an
          organism's proteome.
        range: string
        required: false
        pattern: "^UP[0-9]+$"
        notes:
          - The GPI grammar says this should be a prefixed identifier, but the example
            shows an unprefixed identifier. It is unclear what is actually used in
            practice. This is being modeled as an unprefixed identifier for now.

      go_annotation_complete:
        description: >-
          The date on which a curator determined that the set of GO annotations for an
          entity was complete.
        required: false
        range: date
        notes:
          - The GPI grammar and spec say this can be a date or datetime. It is unclear
            what is actually used in practice. This is being modeled as a date to keep
            it in alignment with other date fields for now.

      go_annotation_summary:
        description: A textual gene or gene-product description.
        range: string
        required: false
    notes:
      - Attributes are used instead of slots here because the names of the attributes
        are somewhat tightly coupled to the GPI file format. They should not be reused
        or modified in other contexts, as top-level slots might be.

  Entity:
    description: >-
      An annotatable biological entity for an organism: protein-coding genes, non-coding
      RNA genes, protein isoforms (i. e., splice variants) and modified forms, such as
      cleaved forms or proteins modified by post-translational modifications.
    slots:
      - db_object_id
      - db_object_symbol
      - db_object_name
      - db_object_synonyms
      - db_object_type
      - db_object_taxon_id
      - encoded_by
      - canonical_object_id
      - protein_containing_complex_members
      - db_xrefs
      - gene_product_properties

settings:
  prefix: "[A-Za-z][A-Za-z0-9_\\-.]*"
  local_id: "[A-Za-z0-9_\\-.:/]+"
