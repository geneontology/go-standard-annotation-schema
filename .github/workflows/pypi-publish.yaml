---
name: Publish Python Package

# Publishes Python distributions to PyPI with trusted publishing and uploads
# the generated JSON Schema to published GitHub Releases.
#
# More on trusted publishing: https://docs.pypi.org/trusted-publishers/

on:  # yamllint disable-line rule:truthy
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.24"

      # https://github.com/actions/setup-python
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install project
        run: uv sync --locked --no-progress

      - name: Generate artifacts
        run: uv run --locked just all

      - name: Build source and wheel archives
        run: uv build

      # https://github.com/actions/upload-artifact
      - name: Store built distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-files
          path: dist/
          if-no-files-found: error

      - name: Store generated JSON Schema
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: json-schema
          path: project/jsonschema/go_standard_annotation_schema.schema.json
          if-no-files-found: error

  pypi-publish:
    name: Publish Python package to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/go_standard_annotation_schema
    permissions:
      id-token: write  # this permission is mandatory for trusted publishing
    steps:
      # https://github.com/actions/download-artifact
      - name: Download built distribution
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-files
          path: dist

      # https://github.com/pypa/gh-action-pypi-publish
      - name: Publish package to PyPI
        # yamllint disable-line rule:line-length
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true

  github-release:
    name: Upload Assets to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # https://github.com/actions/download-artifact
      - name: Download generated JSON Schema
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: json-schema
          path: project/jsonschema

      - name: Upload JSON Schema asset to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            project/jsonschema/go_standard_annotation_schema.schema.json \
            --repo "${{ github.repository }}" \
            --clobber
